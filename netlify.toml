[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Keep the admin page out of search engines and caches.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Short, clean address for the QuickBooks OAuth redirect (registered in the Intuit portal).
[[redirects]]
  from = "/qbo/callback"
  to = "/.netlify/functions/qbo-callback"
  status = 200
  force = true
