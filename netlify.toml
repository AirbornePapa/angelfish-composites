[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Keep the admin page out of search engines and caches.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Short, clean address for the QuickBooks OAuth redirect (registered in the Intuit portal).
[[redirects]]
  from = "/qbo/callback"
  to = "/.netlify/functions/qbo-callback"
  status = 200
  force = true


# Stable short link for the employee timecard. Points at the support
# account OneDrive; update the target if that OneDrive path changes.
[[redirects]]
  from = "/timecard"
  to = "https://angelfishhomes-my.sharepoint.com/:x:/r/personal/support_angelfishgroup_com/_layouts/15/doc2.aspx?sourcedoc=%7BAA5F370D-9994-4DF1-993F-0CA4DC531083%7D&file=Timecard.xlsx&action=default"
  status = 302
  force = true

[[redirects]]
  from = "/timecard/"
  to = "https://angelfishhomes-my.sharepoint.com/:x:/r/personal/support_angelfishgroup_com/_layouts/15/doc2.aspx?sourcedoc=%7BAA5F370D-9994-4DF1-993F-0CA4DC531083%7D&file=Timecard.xlsx&action=default"
  status = 302
